name: Deploy LeaderPrism — Development (Hostinger VPS)

# Dev moved off the Azure VM on 2026-10-02. This builds the api, web and landing
# images, pushes them to GHCR, then SSHes into the shared Hostinger VPS, runs
# migrations + seeds and restarts the compose project in /opt/leaderprism.
# Server setup and secrets: DEPLOYMENT-HOSTINGER.md.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys restart the same compose project at once.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  VM_HOST: 187.127.182.104
  VM_USER: bizosadmin
  APP_DIR: /opt/leaderprism
  APP_URL: https://leaderprism.187-127-182-104.sslip.io
  LANDING_URL: https://leaderprism-landing.187-127-182-104.sslip.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build the apps, then package them into images and push to GHCR.
  # The Dockerfiles copy this job's build output (shared/dist, api/dist,
  # web/.next, landing/out) rather than building inside Docker.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared and api
        run: |
          npm run build -w shared
          npm run build -w api

      # NEXT_PUBLIC_* are inlined into the browser bundle, and next.config.mjs
      # bakes INTERNAL_API_URL into the /api rewrite at build time. It must be
      # this project's service name: plain `api` on the VPS's shared edge
      # network is another tenant's container.
      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: ${{ env.APP_URL }}/api/v1
          INTERNAL_API_URL: http://leaderprism-api:3001
          NEXT_PUBLIC_LANDING_URL: ${{ env.LANDING_URL }}
        run: npm run build -w web

      - name: Build landing (static export)
        env:
          NEXT_PUBLIC_APP_URL: ${{ env.APP_URL }}
        run: npm run build -w landing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # `context: .` (not the default git context) so the build output above is
      # included; .dockerignore keeps node_modules and the rest out.
      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:dev-latest
            ${{ env.IMAGE_PREFIX }}/api:sha-${{ steps.sha.outputs.short }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:dev-latest
            ${{ env.IMAGE_PREFIX }}/web:sha-${{ steps.sha.outputs.short }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push landing image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: landing/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/landing:dev-latest
            ${{ env.IMAGE_PREFIX }}/landing:sha-${{ steps.sha.outputs.short }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Migrate, seed and restart the compose project on the Hostinger VPS
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hostinger VPS (dev)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -z "$VM_SSH_KEY" ]; then
            echo "::error::VM_SSH_KEY is not set — add the bizosadmin private key as a repository secret (see DEPLOYMENT-HOSTINGER.md)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Sync compose files
        run: |
          scp -i ~/.ssh/id_vm deploy/hostinger/docker-compose.yml \
            "$VM_USER@$VM_HOST:$APP_DIR/docker-compose.yml"
          scp -i ~/.ssh/id_vm api/src/database/init.sql \
            "$VM_USER@$VM_HOST:$APP_DIR/init.sql"

      # The one runtime secret kept in GitHub (it predates the move). Sent over
      # stdin, never on a command line, and only rewritten when it changed.
      - name: Sync OPENAI_API_KEY into .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret not set — leaving .env as is."
            exit 0
          fi
          printf '%s' "$OPENAI_API_KEY" | ssh -i ~/.ssh/id_vm "$VM_USER@$VM_HOST" '
            set -eu
            cd /opt/leaderprism
            k=$(cat)
            grep -qxF "OPENAI_API_KEY=$k" .env && exit 0
            umask 077
            { grep -v "^OPENAI_API_KEY=" .env || true; printf "OPENAI_API_KEY=%s\n" "$k"; } > .env.tmp
            mv .env.tmp .env'

      # Migrations and seeds run in one-off containers of the new API image,
      # before the running API is replaced. The seeds are idempotent.
      # The VPS's docker is normally already logged in to GHCR; GHCR_PULL_TOKEN
      # (a PAT with read:packages) is only needed if that login ever lapses.
      - name: Pull, migrate, seed and restart
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -n "$GHCR_PULL_TOKEN" ]; then
            echo "$GHCR_PULL_TOKEN" | ssh -i ~/.ssh/id_vm "$VM_USER@$VM_HOST" \
              "docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin"
          fi
          ssh -i ~/.ssh/id_vm "$VM_USER@$VM_HOST" '
            set -eu
            cd /opt/leaderprism
            docker compose pull leaderprism-api leaderprism-web leaderprism-landing
            docker compose up -d --wait postgres redis
            docker compose run --rm --no-deps -T leaderprism-api \
              npx typeorm migration:run -d api/dist/api/src/database/data-source.js
            docker compose run --rm --no-deps -T leaderprism-api \
              node api/dist/api/src/database/seeds/run-seeds.js
            docker compose run --rm --no-deps -T leaderprism-api \
              node api/dist/api/src/database/seeds/run-thrivehive-seed.js
            docker compose up -d --remove-orphans
            # Superseded dev-latest images of this repo only — never a blanket prune
            # on this shared box (see /opt/README.md).
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/techneura2026/leadership"'

      # There is no health endpoint: any non-5xx answer from a guarded API route
      # (normally 401) means Nest is up. Caddy answers 502 while it is not.
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$APP_URL/api/v1/organisations/me" || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "✅ API up (HTTP $code)"
              if ! curl -fsS --max-time 15 -o /dev/null "$APP_URL/login"; then
                echo "::error::Web not responding — check: cd $APP_DIR && docker compose logs leaderprism-web"
                exit 1
              fi
              echo "✅ Web responding"
              if ! curl -fsS --max-time 15 -o /dev/null "$LANDING_URL/"; then
                echo "::error::Landing not responding — check: cd $APP_DIR && docker compose logs leaderprism-landing"
                exit 1
              fi
              echo "✅ Landing responding"
              exit 0
            fi
            echo "Waiting for API ($i/30, last HTTP $code)..."
            sleep 10
          done
          echo "::error::API did not come up — check: cd $APP_DIR && docker compose logs leaderprism-api"
          ssh -i ~/.ssh/id_vm "$VM_USER@$VM_HOST" "cd $APP_DIR && docker compose ps && docker compose logs --tail 80 leaderprism-api"
          exit 1
